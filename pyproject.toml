[project]
name = "client"
version = "0.1.0"
description = "Untrusted counterparty to Broker: places orders, evaluates deliverables, pays"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.scripts]
client = "client.agent:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
